# cargo-deny — dependency advisories and license hygiene (07-SECURITY §4).
#
# This file is short because of D-24: the contracts carry **zero third-party
# contract-code dependencies** — SEP-41, pausable, upgradeable and the admin
# logic are all hand-rolled — so the graph below is `soroban-sdk` and its own
# transitive set and nothing else. That is a deliberately narrowed audit scope,
# not an absence of things to check.

[advisories]
yanked = "deny"

# Two accepted advisories, each triaged in writing rather than waved through by
# widening a setting. Everything not listed here still fails the build.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = """
`paste 1.0.15` is unmaintained — an advisory about the crate's future, not a
vulnerability in it. It reaches us four levels down (ark-ff → ark-* →
soroban-env-host → soroban-sdk), so there is nothing to upgrade on our side
short of forking the SDK's dependency graph, and it is a **proc macro**: it runs
at compile time and no byte of it is in the wasm the vault deploys. Left as an
ID-scoped ignore rather than `unmaintained = "workspace"`, which would have
suppressed every future transitive advisory of the same class along with it.
Re-check when soroban-sdk moves off it; if this ever becomes a
vulnerability advisory rather than an unmaintained one, it stops being ignored
here and becomes a finding.
""" },
    { id = "RUSTSEC-2026-0387", reason = """
`crypto-bigint 0.5.5` has timing variability in operations that are supposed to
be constant-time. Unlike the advisory above this IS a vulnerability advisory, so
it is accepted on scope rather than on class, and the scope was measured rather
than assumed: `cargo tree --target wasm32v1-none -p antares-vault` does not
contain crypto-bigint at all. It arrives only in the HOST build —
soroban-env-host → k256/p256 → ecdsa → elliptic-curve → crypto-bigint — which is
the native test host `cargo test` links, not the wasm the vault deploys. No byte
of it is in the shipped artefact, so there is no signature this contract makes
whose timing could leak through it.
Nothing to upgrade on our side either: the fix is `>=0.7.6` and the version is
chosen by elliptic-curve, four levels up our only dependency. It was already in
the lockfile at soroban-sdk 27.0.6 — the advisory was published 2026-10-23 and
is what changed, not the graph.
**Remove this entry when soroban-sdk ships an env-host built on
elliptic-curve >= 0.14 / crypto-bigint >= 0.7.6**, and re-check it the moment
anything in this repository starts verifying a signature inside the contract
rather than in a test — that would put the code in the wasm and this reasoning
would no longer hold.
""" },
]

[licenses]
# Exactly the licenses the graph actually *requires*, measured 2026-08-18 over
# 217 packages. Where a package offers a choice (`MIT OR Apache-2.0 OR Zlib`)
# only the one taken is listed, so the set is the smallest that satisfies the
# tree rather than the widest that happens to cover it. A new license arriving
# in the graph then becomes a decision somebody makes on purpose.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0", # unicode-ident: "(MIT OR Apache-2.0) AND Unicode-3.0"
]

# wasmparser ships under the LLVM exception with no alternative offered. It
# arrives through soroban-sdk's own toolchain crates, not through a choice of
# ours, and the exception is a permissive addition to Apache-2.0.
[[licenses.exceptions]]
name = "wasmparser"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
name = "wasmparser-nostd"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
# D-23 pins exact versions and D-50's gate is stated against a byte. A wildcard
# dependency lets a build change under us with nothing in the repository
# changing — which is the failure the whole pinning discipline exists to stop.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
