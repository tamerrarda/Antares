# Antares CI — the single workflow of 06-TEST-PLAN §8, jobs in its dependency order.
#
#   fmt → clippy → test → vector-diff → network-agnostic check
#       → wasm build + size check → reproducible-build
#   scout-audit, fuzz smoke and cargo-mutants: opt-in per run, see the inputs
#   below. Scout is opt-in rather than per-build since 2026-08-19: measured at
#   9 m 57 s and still compiling itself when cancelled, to analyse nothing
#   (KNOWN_ISSUES O-6). When it does run it is gated on its log, never its exit
#   code.
#   cargo-mutants is required at the Phase-4 gate and pointless before it.
#
# TWO OWNERS, ONE FILE (DEV-PROTOCOL §3). Everything below is DEV1's except the
# region marked `DEV3 REGION`, which carries the TypeScript jobs — TS lint,
# typecheck, `pnpm -r build`, and the TypeScript scope of the network-agnostic
# check. DEV3 writes those; DEV1 reviews them. Stated here so it is not
# discovered as a merge conflict.
#
# Jobs whose inputs do not exist yet (the Python reference, the fuzz targets,
# the snapshots) do not pass quietly — they say what is missing and name the
# phase in which they become mandatory. A gate that goes green on an empty tree
# has not proved anything, and this file refuses to imply otherwise.

name: CI

# MANUAL ONLY, and deliberately so (decided 2026-08-18).
#
# The repository is private for now, so Actions minutes come out of a monthly
# allowance rather than being free as they are on a public repository. Nothing
# here fires on a push, a pull request or a schedule: run it from the Actions
# tab, or `gh workflow run ci.yml --ref <branch>`.
#
# **It must be run, and its result recorded in `plan/STANDUP.md`, before every
# integration-point signature.** That is what keeps D-50's reproducibility gate
# a gate — the rule is that it is asserted from the first commit rather than
# discovered at the mainnet deploy, and a workflow nobody runs asserts nothing.
# 06-TEST-PLAN §8 carries this as the standing policy.
#
# Restore the automatic triggers when the repository goes public. When that
# happens, fix two things first, both measured on the only automatic run this
# workflow ever had (2026-08-18): `scout-audit` compiles itself from source on
# every run — 13 minutes to analyse nothing — and `push` plus `pull_request`
# together ran the whole chain twice for one commit. Without those two, a full
# run is about ten billable minutes.
on:
  workflow_dispatch:
    inputs:
      # Off by default, and each is opt-in for its own reason. The fuzz smoke
      # needs a nightly toolchain and cargo-fuzz built from source; the mutation
      # run can occupy a runner for hours and is required at the Phase-4 gate,
      # not before it. With `workflow_dispatch` now the only trigger, leaving
      # them on the default path would mean every routine run started both.
      run_fuzz:
        description: "Also run the fuzz smoke (5 min per target)"
        type: boolean
        default: false
      run_mutants:
        description: "Also run cargo-mutants (long; required at the Phase-4 gate)"
        type: boolean
        default: false
      run_scout:
        description: "Also run scout-audit (~14 min, and currently analyses nothing — KNOWN_ISSUES O-6)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # D-23: the exact patch version, pinned in CI as well as in the README.
  # "27.x" is a range and a range reproduces no byte, which is the whole of
  # D-50's gate. Measured 2026-08-18: 27.1.0, released 2026-07-31.
  STELLAR_CLI_VERSION: "27.1.0"
  STELLAR_CLI_SHA256: "9915fe63753d7154c26bb9e6410cf1d1ff9727a9b378e663c2790ab7a266af94"
  WASM_HARD_LIMIT_BYTES: "65536" # 64 KB — the protocol's limit; hard fail
  WASM_WARN_BYTES: "49152" # 48 KB — warn, per 06-TEST-PLAN §8
  # NOTE: RUSTFLAGS is deliberately NOT set here. `stellar contract build` passes
  # CARGO_BUILD_RUSTFLAGS with a --remap-path-prefix for the cargo registry, and
  # RUSTFLAGS takes precedence over it — setting one globally would silently
  # discard the remapping and make the reproducible-build job depend on where
  # each runner happens to keep CARGO_HOME.

jobs:
  # ---------------------------------------------------------------- 1. fmt ---
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # No version here: rustup reads rust-toolchain.toml, so this step also
        # proves CI builds with the version D-50's gate is stated against.
        run: |
          rustup toolchain install
          rustup show
      - run: cargo fmt --all --check

  # ------------------------------------------------- 1b. static source rules ---

  static-rules:
    name: static source rules (one script, runnable locally)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every source rule a grep can decide
        # Seven rules: D-70's doc budget, D-63's write-once field, D-50's
        # network-agnostic build, 03-STORAGE-TTL's temporary() ban, 07-SECURITY
        # §3's outbound markers and §6's secret scan, and workflow key uniqueness.
        # The script says what each defends and where it stops; read it rather
        # than this comment.
        #
        # The greps used to be a second job here. They were correct and they were
        # unrunnable without spending a CI run, which is the objection the IP-only
        # CI policy could not survive — so they moved into the script instead and
        # the job they lived in is gone. One job, one script, one command.
        #
        # The last rule is why the others can be trusted locally: a second job
        # keyed `static-rules` was added beside this one, GitHub rejected the file,
        # and `yaml.safe_load` called it valid both times because it keeps the last
        # of a duplicate pair. Every rule here was run against a tree with a
        # violation planted in it and seen to exit 1; that one was seen to fail on
        # the real defect.
        run: python3 scripts/ci/static_rules.py

  # ------------------------------------------------------------- 2. clippy ---
  clippy:
    name: clippy (-D warnings)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2

      - name: clippy — everything, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy — arithmetic_side_effects on the deployed code
        # 07-SECURITY §3's integer-overflow row names this lint beside
        # `overflow-checks` because they catch different things: the profile flag
        # turns a wrap into a panic at run time, the lint refuses the unchecked
        # write at compile time. 02-CONTRACT-SPEC §8's bounds are proofs about
        # the inputs; `checked_*` is what makes a violated proof a revert.
        #
        # Library targets only. The control is about the code that moves money —
        # extending it over test code would only teach us to add `allow`s.
        run: cargo clippy --workspace --lib -- -D warnings -D clippy::arithmetic_side_effects

  # --------------------------------------------------------------- 3. test ---
  test:
    name: test + snapshot diff
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --all-targets

      - name: Snapshots must be committed, and a behaviour change must show in the diff
        # 06-TEST-PLAN §1/§8: soroban writes `test_snapshots/` at the end of every
        # test. Committed, they turn a behavioural change into a reviewable diff
        # instead of something a reviewer has to remember.
        run: |
          set -euo pipefail
          if ! ls -d contracts/*/test_snapshots >/dev/null 2>&1; then
            echo "::notice::No test_snapshots/ yet — soroban writes them once tests exist."
            echo "::notice::Mandatory from Phase 2 (06-TEST-PLAN §1). Nothing to diff today."
            exit 0
          fi
          # Regression guard, and the reason the exclusion below exists at all.
          # These files were committed once and made this job fail on every run,
          # because proptest reseeds from entropy and rewrites all 145 of them.
          # An always-red gate is read as broken, not as a finding, and it takes
          # the 198 deterministic snapshots down with it.
          tracked_props=$(git ls-files -- '*test_snapshots/test_properties*')
          if [ -n "$tracked_props" ]; then
            echo "::error::Property-test snapshots are tracked again:"
            echo "$tracked_props"
            echo "They differ on every run and carry no review signal — see .gitignore."
            exit 1
          fi

          changed=$(git status --porcelain -- '*test_snapshots*')
          if [ -n "$changed" ]; then
            echo "::error::Test snapshots changed but were not committed:"
            echo "$changed"
            echo "A behaviour change must be visible in the pull request diff."
            git --no-pager diff -- '*test_snapshots*' | head -200
            exit 1
          fi
          echo "Snapshots match the committed state ($(git ls-files -- '*test_snapshots*' | wc -l) deterministic)."

      - name: Surface the failing seed if a property broke
        # proptest writes the seed that broke an invariant to
        # `proptest-regressions/` — but only on failure, and only into the
        # runner's filesystem, which is discarded. Printing it is the difference
        # between a reproducible bug and "CI was red once".
        if: failure()
        run: |
          find . -name '*.proptest-regressions' -not -path './target/*' \
            -exec echo '--- {} ---' \; -exec cat {} \; || true

  # -------------------------------------------------------- 4. vector-diff ---
  vector-diff:
    name: vector diff (Rust ↔ Python)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay the shared vectors against both implementations
        # The logic is in scripts/ci/vector_diff.sh so the section-close checklist
        # runs exactly what CI runs. DEV3's both-or-neither guard is kept verbatim
        # inside it; the directional asymmetry is the one change, and it is
        # explained there rather than here.
        run: bash scripts/ci/vector_diff.sh

  scout-audit:
    name: scout-audit (opt-in, non-blocking)
    if: inputs.run_scout
    needs: test
    runs-on: ubuntu-latest
    # Out of the blocking chain since 2026-08-18 (06-TEST-PLAN §8, KNOWN_ISSUES
    # O-6). Not because failures here are tolerable — because Scout cannot
    # currently run at all against our pinned target, and blocking every branch
    # on a tool that analyses nothing buys nothing. The step below still refuses
    # to call that state a pass, which is the half that matters: this job reports
    # "did not analyse anything", never "found nothing".
    #
    # OPT-IN SINCE 2026-08-19 (Tamer), and the measurement is the reason. It ran
    # on `dev2` and was cancelled at 9 m 57 s still compiling itself, having
    # analysed nothing — while the entire blocking chain finished in 4 m 23 s.
    # GitHub bills each job rounded up to the minute, so this one job was about
    # 60 % of a routine run's cost on a private repository, for a tool that
    # cannot run against D-23's pinned target at all.
    #
    # The 2026-08-18 decision said it "still runs on every build". That half is
    # what changes: paying every branch for a control that is known to be
    # inoperative is not diligence, it is a standing charge. What does NOT change
    # is the half that mattered — when it runs it is still gated on its LOG and
    # never on its exit code, so it reports "did not analyse anything" rather
    # than "found nothing". A control that reports success without running is
    # worse than no control, because it is believed.
    #
    # Run it deliberately: `gh workflow run ci.yml --ref <branch> -f run_scout=true`.
    # Required before the Phase-8 review, where the choice between waiting for
    # upstream and promoting OpenZeppelin's soroban-scanner gets made.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install Scout
        run: cargo install cargo-scout-audit --locked
      - name: Run Scout — and prove it analysed something
        # 07-SECURITY §4's relevant detectors: overflow-check,
        # unprotected-update-current-contract-wasm (must flag nothing — our
        # `upgrade` is auth-gated), divide-before-multiply,
        # dos-unbounded-operation, unsafe-unwrap, set-contract-storage.
        #
        # MEASURED 2026-08-18, cargo-scout-audit 0.3.16 (the current release):
        # Scout builds the analysed crate for `wasm32-unknown-unknown`, and
        # soroban-sdk 27.0.6's build.rs refuses that target on Rust 1.82+ —
        # naming `wasm32v1-none`, which is exactly D-23's pin. So its analysis
        # build fails for all three crates. It then **exits 0 and prints
        # "Analyzed · 0 · 0 · 0 · 0" for each one anyway**, and passing
        # `-- --target wasm32v1-none` does not change it.
        #
        # Scout's exit code therefore cannot be this gate. A security control
        # that reports success without having run is worse than no control,
        # because it is believed — and this project has already shipped one gate
        # that was satisfied by the exact failure it was written to detect. The
        # log is inspected instead, and every crate must appear in the summary.
        #
        # This step is expected to FAIL until the finding is resolved. That is
        # deliberate and it is filed, not a mystery: the choice between waiting
        # for upstream, promoting OpenZeppelin's soroban-scanner (07-SECURITY §4
        # already lists it), and taking Scout out of the blocking chain is a
        # change to a named control, so it belongs to 07-SECURITY, not here.
        run: |
          set -uo pipefail
          cargo scout-audit 2>&1 | tee scout.log
          scout_status=${PIPESTATUS[0]}

          if grep -qE 'failed to run custom build command|build failed|^error\[E[0-9]+\]' scout.log; then
            echo "::error::Scout's analysis build failed — its summary table reports on nothing."
            grep -nE 'failed to run custom build command|build failed|^error\[E[0-9]+\]' scout.log | head -20
            exit 1
          fi

          for crate in antares_vault mock_price_source reflector_adapter; do
            grep -q "$crate" scout.log || {
              echo "::error::Scout produced no result row for $crate."
              exit 1
            }
          done

          exit "$scout_status"

  # ------------------------------------------------------- 6. supply chain ---
  supply-chain:
    name: cargo-audit + cargo-deny
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit --deny warnings
      - run: cargo deny check

  # ----------------------------------------------- 8. wasm build + size ------
  wasm:
    name: wasm build + size check
    needs: [test, static-rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Install the pinned stellar-cli
        run: |
          set -euo pipefail
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o stellar-cli.tar.gz "$url"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          tar xzf stellar-cli.tar.gz
          install -m755 stellar "$HOME/.local/bin/stellar" 2>/dev/null || { mkdir -p "$HOME/.local/bin"; install -m755 stellar "$HOME/.local/bin/stellar"; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build all three contracts
        run: stellar contract build --out-dir target/wasm

      - name: Size check — 64 KB hard, 48 KB warn
        run: |
          set -euo pipefail
          status=0
          for f in target/wasm/*.wasm; do
            size=$(stat -c%s "$f")
            printf '%-32s %8d bytes\n' "$(basename "$f")" "$size"
            if [ "$size" -ge "$WASM_HARD_LIMIT_BYTES" ]; then
              echo "::error file=$f::$(basename "$f") is $size bytes, at or over the ${WASM_HARD_LIMIT_BYTES}-byte limit"
              status=1
            elif [ "$size" -gt "$WASM_WARN_BYTES" ]; then
              echo "::warning file=$f::$(basename "$f") is $size bytes, past the ${WASM_WARN_BYTES}-byte warning line"
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/wasm/*.wasm

  # ------------------------------------------- 9. reproducible build (D-50) ---
  reproducible:
    name: reproducible build (byte-identical wasm)
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      # Two checkouts of the same commit at deliberately different path lengths.
      # The path is the thing that leaks: rustc embeds source paths in panic
      # locations, and `stellar contract build` remaps the cargo registry but not
      # the workspace. If a build ever starts depending on where it was run, this
      # is the job that says so — on the day it starts, not at the mainnet deploy.
      - uses: actions/checkout@v4
        with:
          path: a
      - uses: actions/checkout@v4
        with:
          path: build-two-with-a-much-longer-path
      - run: |
          cd a
          rustup toolchain install
          rustup show

      - name: Install the pinned stellar-cli
        run: |
          set -euo pipefail
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o stellar-cli.tar.gz "$url"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          tar xzf stellar-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m755 stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build twice, in separate clean environments
        run: |
          set -euo pipefail
          for d in a build-two-with-a-much-longer-path; do
            ( cd "$d" && CARGO_TARGET_DIR="$PWD/target" stellar contract build --out-dir out >/dev/null )
          done

      - name: Assert the hashes are identical
        run: |
          set -euo pipefail
          status=0
          : > wasm-hashes.txt
          for f in a/out/*.wasm; do
            name=$(basename "$f")
            h1=$(sha256sum "a/out/$name" | cut -d' ' -f1)
            h2=$(sha256sum "build-two-with-a-much-longer-path/out/$name" | cut -d' ' -f1)
            printf '%-32s %s\n' "$name" "$h1" | tee -a wasm-hashes.txt
            if [ "$h1" != "$h2" ]; then
              echo "::error::$name is not reproducible: $h1 vs $h2"
              echo "The audited binary and the deployed binary can no longer be shown to be the same (D-50)."
              status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-hashes
          path: wasm-hashes.txt

  # ------------------------------------------------ 10. nightly fuzz smoke ---
  fuzz-smoke:
    name: fuzz smoke (nightly, 5 min per target)
    if: inputs.run_fuzz
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run each target for five minutes
        # 06-TEST-PLAN §4 / §8. Three targets land in Phase 4; the long local
        # runs are separate from this smoke, and the Phase-4 gate says so.
        run: |
          set -euo pipefail
          if [ ! -d fuzz/fuzz_targets ]; then
            echo "::notice::fuzz/fuzz_targets does not exist yet — the three targets land in Phase 4"
            echo "::notice::(06-TEST-PLAN §4). Mandatory from there; nothing to smoke today."
            exit 0
          fi
          rustup toolchain install nightly
          cargo +nightly install cargo-fuzz --locked
          for t in fuzz/fuzz_targets/*.rs; do
            name=$(basename "$t" .rs)
            echo "--- $name ---"
            cargo +nightly fuzz run "$name" -- -max_total_time=300
          done

  # ------------------------------------------- 11. mutation (manual/weekly) ---
  mutants:
    name: cargo-mutants (manual / weekly)
    if: inputs.run_mutants
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run mutants
        # Required at the **Phase-4 gate**, never per-PR (06-TEST-PLAN §6/§8).
        # The thresholds are per module and are checked there, not here:
        # 0 MISSED in vault/epoch/auction/settle/claims/oracle/token/storage,
        # ≤5 % per module in admin and types, ≤5 % crate-wide, every survivor
        # triaged in writing.
        run: cargo mutants --workspace --no-shuffle -j 2 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out/

  # =========================== DEV3 REGION ==================================
  # The TypeScript half of this workflow is DEV3's to write and DEV1's to review
  # (DEV-PROTOCOL §3). It belongs here, in this file, not in a second workflow.
  #
  # What goes in it:
  #   - TS lint and typecheck
  #   - `pnpm -r build`
  #   - the network-agnostic check's **TypeScript scope**: no hardcoded network
  #     passphrases and no hardcoded contract addresses across keeper/, bidder/,
  #     web/, integration/, packages/, scripts/ — with `packages/common/networks.ts`
  #     and `deployments/*.json` exempt. 06-TEST-PLAN §8 is the single home for
  #     that scope and its exemptions; read it there. The exemption is the point
  #     of the rule rather than a hole in it: the values have to live somewhere,
  #     and the check exists to prove they live *only* there.
  #
  # DEV1 does not write these and does not let them go unwritten.
  # ==========================================================================
  #
  # WRITTEN 2026-08-19 (DEV3). Two jobs, and one note on each for the reviewer:
  #
  #   ts             fmt → lint → typecheck → build → unit tests, in that order,
  #                  behind `pnpm install --frozen-lockfile`. The lockfile is the
  #                  pin on the off-chain side — D-23's off-chain row is a caret
  #                  range and D-50's byte-identical gate is about the wasm, which
  #                  no npm package is an input to (Tamer's ruling, 2026-08-19).
  #                  **`--frozen-lockfile` is what makes that ruling true rather
  #                  than nominal: a lockfile the pipeline may ignore is not a pin,
  #                  it is a suggestion.**
  #
  #   static-rules-ts  runs the check's OWN rejecting harness first, then the check.
  #                  Both live in `scripts/ci/`, so CI and a developer's terminal
  #                  run the same bytes — DEV1 measured that a hand-copied
  #                  paraphrase of a step lets the harness and CI disagree, and
  #                  that their zsh/ugrep box and the runner's bash/GNU grep did.
  #                  A shared file removes both by construction. Running the
  #                  harness *in CI* is the other half: "verified locally" is
  #                  weaker than it sounds, so every run re-proves the check still
  #                  rejects. 26 cases, both directions, ~2 s.
  #
  # `static-rules-ts` deliberately has no `needs:`. It is a grep over tracked text
  # and gains nothing from waiting on a Rust compile — and on a private repository
  # billed by the minute, making a two-second job queue behind a two-minute one is
  # the cost this workflow just finished removing.

  # -------------------------------------------- 12. TypeScript checks (DEV3) ---
  ts:
    name: TS fmt + lint + typecheck + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose: `packageManager` in the root
      # package.json is its single home (pnpm@11.1.2), and action-setup reads it.
      # A second copy in this file is a second thing to bump.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, per D-23's off-chain row and `engines` in the root manifest.
          # Not a patch pin, and that is consistent rather than sloppy: D-23's
          # exactness argument is D-50's wasm hash, and Node is not an input to
          # it. `--experimental-strip-types` and `erasableSyntaxOnly` only get
          # more capable across 22.x.
          node-version: 22
          cache: pnpm

      - name: Install — the lockfile is the pin
        run: pnpm install --frozen-lockfile

      - name: fmt (prettier --check)
        # Markdown is excluded in `.prettierignore` and the reason is written
        # there: docs/* and the root README take two sign-offs, and a formatter
        # has no business reflowing a sentence three people agreed on.
        run: pnpm fmt

      - name: lint (eslint, --max-warnings 0)
        # `-D warnings`' equivalent. Type-aware rules are on, because the ones
        # worth having need types: an un-awaited promise in the keeper's loop is
        # a round that silently did not close.
        run: pnpm lint

      - name: typecheck (tsc --noEmit, strict)
        run: pnpm typecheck

      - name: build (pnpm -r build)
        # Real work rather than an echo for `packages/common`: Node does not
        # type-strip files under `node_modules/`, and pnpm links workspace
        # packages there — so a compiled `dist/` is the only thing keeper/,
        # bidder/, web/ and integration/ can actually import.
        run: pnpm build

      - name: unit tests
        run: pnpm test

  # ------------------------- 13. network-agnostic, TypeScript scope (DEV3) ---
  static-rules-ts:
    name: network-agnostic (TypeScript scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drive the check to REJECT as well as pass
        # A gate only ever verified in the passing direction is a gate nobody has
        # tested. This runs before the check itself so a run can never report
        # "clean" from a check that had stopped rejecting.
        run: bash scripts/ci/test-network-agnostic-ts.sh

      - name: Run the check
        run: bash scripts/ci/network-agnostic-ts.sh
