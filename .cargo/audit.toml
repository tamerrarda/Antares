# cargo-audit's half of the supply-chain check (07-SECURITY §4).
#
# The **triage lives in `deny.toml`** — that file is the single home for which
# advisories are accepted and why. This file repeats only the identifier,
# because cargo-audit cannot read cargo-deny's config, and repeating the
# reasoning here would create the second independent assertion of one fact that
# this project's drift has come from every time.
#
# RUSTSEC-2024-0436 — see `deny.toml` for the reasoning.

[advisories]
ignore = ["RUSTSEC-2024-0436"]
