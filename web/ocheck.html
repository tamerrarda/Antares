<!doctype html>
<html><head><meta charset="utf-8"><title>overflow check</title>
<style>body{background:#0d0f14;color:#e8e6e1;font:13px ui-monospace,Menlo,monospace;padding:20px}
table{border-collapse:collapse}td,th{padding:5px 12px;text-align:left;border-bottom:1px solid #262a33}
.ok{color:#6ee7a8}.bad{color:#ff6b3d;font-weight:700}iframe{position:absolute;left:-9999px;top:0}</style>
</head><body>
<h3>Horizontal overflow — measured, not eyeballed</h3>
<table id="t"><tr><th>screen</th><th>width</th><th>scrollWidth</th><th></th></tr></table>
<script>
// A page whose body is wider than its viewport is the one mobile bug that is invisible in a
// screenshot taken at the wrong window size. This compares documentElement.scrollWidth against
// clientWidth in a same-origin iframe, which is the only measurement that settles it.
const SCREENS = ["auction:on","window:on","delayed:on","settled:on","rounds","claims","positions","compare","operator"];
const WIDTHS = [320, 375, 393, 430, 744];
const t = document.getElementById("t");
let queue = [];
SCREENS.forEach(s => WIDTHS.forEach(w => queue.push([s, w])));
let i = 0;
function next() {
  if (i >= queue.length) { document.title = "done"; return; }
  const [s, w] = queue[i++];
  const f = document.createElement("iframe");
  f.width = w; f.height = 900; f.src = "./app.html#" + s;
  f.onload = () => {
    setTimeout(() => {
      const d = f.contentDocument.documentElement;
      const over = d.scrollWidth - d.clientWidth;
      if (over > 0) {
        const r = t.insertRow();
        r.innerHTML = `<td>${s}</td><td>${w}</td><td>${d.scrollWidth}</td><td class="bad">OVERFLOWS by ${over}px</td>`;
      }
      f.remove(); next();
    }, 120);
  };
  document.body.appendChild(f);
}
next();
setTimeout(() => {
  if (t.rows.length === 1) {
    const r = t.insertRow();
    r.innerHTML = `<td colspan="4" class="ok">All ${queue.length} combinations clean — no page is wider than its viewport.</td>`;
  }
}, 26000);
</script></body></html>
