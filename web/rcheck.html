<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>rcheck</title>
    <style>
      body {
        margin: 0;
        background: #1a1a1a;
        font:
          12px ui-monospace,
          monospace;
        color: #9f9;
        display: flex;
        gap: 12px;
        padding: 12px;
        align-items: flex-start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      iframe {
        border: 1px solid #444;
        display: block;
        background: #000;
      }
      .cap {
        color: #7fd;
      }
    </style>
  </head>
  <body>
    <script>
      const P = new URLSearchParams(location.search).get("p") || "0";
      const views = [
        [390, 844, "390x844 dikey"],
        [430, 932, "430x932 dikey"],
        [844, 390, "844x390 YATAY"],
        [834, 1000, "834x1000 iPad"],
      ];
      document.addEventListener("DOMContentLoaded", () => {
        for (const [w, h, label] of views) {
          const col = document.createElement("div");
          col.className = "col";
          const cap = document.createElement("div");
          cap.className = "cap";
          cap.textContent = `${label}  p=${P}`;
          const f = document.createElement("iframe");
          f.width = w;
          f.height = h;
          f.src = "/demo.html";
          f.addEventListener("load", () => {
            setTimeout(() => {
              const d = f.contentDocument,
                win = f.contentWindow;
              const max = d.body.scrollHeight - win.innerHeight;
              win.scrollTo(0, max * parseFloat(P));
            }, 1200);
          });
          col.append(cap, f);
          document.body.append(col);
        }
      });
    </script>
  </body>
</html>
